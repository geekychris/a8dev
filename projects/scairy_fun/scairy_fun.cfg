# ScAIry Fun's memory: the a8dev map (sdk/cfg/a8.cfg) plus the 14K of RAM
# under the OS ROM, which the game switches off (src/os.s). The code that
# runs there (HIA, HIA2, HIB: the renderer, the sprites, the routes) is loaded in three chunks
# into the screen area ($A000, free while the program loads), and an INIT
# entry after each (stage.s) copies it under the ROM before the next chunk
# loads. The routes' segment arrays live in LOWRAM, the renderer's state in
# the screen area's spare half (SCRBSS).
FEATURES {
    STARTADDRESS: default = $2000;
}
SYMBOLS {
    __EXEHDR__:          type = import;
    __SYSTEM_CHECK__:    type = import;
    __AUTOSTART__:       type = import;
    __A8_INIT__:         type = import;   # sdk/src/crt.s (stack, BASIC off)
    __STACKSIZE__:       type = weak, value = $0800;
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak, value = $0000;
}
MEMORY {
    ZP:         file = "", define = yes, start = $0082, size = $007E;
    HEADER:     file = %O,               start = $0000, size = $0002;
    SYSCHKHDR:  file = %O,               start = $0000, size = $0004;
    SYSCHKCHNK: file = %O,               start = $2E00, size = $0300;
    SYSCHKTRL:  file = %O,               start = $0000, size = $0006;
    LOWMEM:     file = "",               start = $0C00, size = $1400;
    MAINHDR:    file = %O,               start = $0000, size = $0004;
    MAIN:       file = %O, define = yes, start = %S,    size = $9500 - %S;
    HIAHDR:     file = %O,               start = $0000, size = $0004;
    HIASTAGE:   file = %O, define = yes, start = $A000, size = $2000;
    HIAINIT:    file = %O,               start = $0000, size = $0006;
    HIA2HDR:    file = %O,               start = $0000, size = $0004;
    HIA2STAGE:  file = %O, define = yes, start = $A000, size = $2000;
    HIA2INIT:   file = %O,               start = $0000, size = $0006;
    HIBHDR:     file = %O,               start = $0000, size = $0004;
    HIBSTAGE:   file = %O, define = yes, start = $A000, size = $2000;
    HIBINIT:    file = %O,               start = $0000, size = $0006;
    TRAILER:    file = %O,               start = $0000, size = $0006;
    HIARAM:     file = "", define = yes, start = $D800, size = $27FA;   # to $FFF9 (the vectors above)
    HIBRAM:     file = "", define = yes, start = $C000, size = $1000;
    SCRSPARE:   file = "", define = yes, start = $AC00, size = $0C00;   # (bitmap $A000, display lists $A900, text $AB00; the font at $B800)
    STACK:      file = "", define = yes, start = $9500, size = $0300;   # (most locals are static)
    PMG:        file = "", define = yes, start = $9800, size = $0800;
    SCREEN:     file = "", define = yes, start = $A000, size = $2000;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,         type = zp;
    EXTZP:     load = ZP,         type = zp,                optional = yes;
    EXEHDR:    load = HEADER,     type = ro;
    SYSCHKHDR: load = SYSCHKHDR,  type = ro,                optional = yes;
    SYSCHK:    load = SYSCHKCHNK, type = rw,  define = yes, optional = yes;
    SYSCHKTRL: load = SYSCHKTRL,  type = ro,                optional = yes;
    LOWRAM:    load = LOWMEM,     type = bss, define = yes, optional = yes;
    MAINHDR:   load = MAINHDR,    type = ro;
    STARTUP:   load = MAIN,       type = ro,  define = yes;
    LOWBSS:    load = MAIN,       type = rw,                optional = yes;
    LOWCODE:   load = MAIN,       type = ro,  define = yes, optional = yes;
    LOWDATA:   load = MAIN,       type = rw,  define = yes, optional = yes;
    ONCE:      load = MAIN,       type = ro,                optional = yes;
    CODE:      load = MAIN,       type = ro,  define = yes;
    RODATA:    load = MAIN,       type = ro;
    DATA:      load = MAIN,       type = rw;
    INIT:      load = MAIN,       type = bss, define = yes, optional = yes;
    BSS:       load = MAIN,       type = bss, define = yes;
    HIAHDR:    load = HIAHDR,     type = ro;
    HIA:       load = HIASTAGE, run = HIARAM, type = rw, define = yes;
    HIAINIT:   load = HIAINIT,    type = ro;
    HIA2HDR:   load = HIA2HDR,    type = ro;
    HIA2:      load = HIA2STAGE, run = HIARAM, type = rw, define = yes;
    HIA2INIT:  load = HIA2INIT,   type = ro;
    HIABSS:    load = HIARAM,     type = bss, define = yes;
    HIBHDR:    load = HIBHDR,     type = ro;
    HIB:       load = HIBSTAGE, run = HIBRAM, type = rw, define = yes;
    HIBINIT:   load = HIBINIT,    type = ro;
    SCRBSS:    load = SCRSPARE,   type = bss, define = yes;
    AUTOSTRT:  load = TRAILER,    type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}

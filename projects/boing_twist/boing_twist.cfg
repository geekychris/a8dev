# Boing Twist's linker config: sdk/cfg/a8.cfg plus
#   - the 130XE banks' contents in the XEX (src/xbanks.s): bank 0-3 at $4000
#   - the RAM under the OS ROM (the game switches the OS off at start-up,
#     src/os.s): HIRAM1 $C000-$CFFF the game's state (HIBSS), TEXRAM
#     $D800-$E3FF the ball's texture, HIRAM2 $E400-$FFF9 the rules' code
#     (bt_core.c: HICODE), loaded into bank 2 at $6680 and copied up
#   - VECBSS (the self-test's puzzle, $A000) and SIGBSS ($A040) in the
#     screen area, used only while nothing is shown there
#
# Derived from the a8dev linker config (cc65 target "atari": the OS ROM stays in, so the same
# XEX runs on a 48K 400/800 and on XL/XE/130XE).
#
# Fixed memory map (sdk/include/a8.h has the same numbers):
#   $2000-$3FFF  STARTUP + LOWCODE + LOWDATA first: below the 130XE bank window
#                ($4000-$7FFF), so the bank routines and bounce buffers stay
#                visible while a bank is mapped. project.mk checks this.
#   $2000-$8FFF  MAIN: code, rodata, data, bss (36K)
#   $9000-$97FF  C stack (2K; a8_crt_init points the stack here)
#   $9800-$9FFF  player/missile graphics (PMBASE $98, single-line)
#   $A000-$BFFF  screen: display list + screen memory (sdk gfx_init); BASIC
#                is switched off on XL/XE by a8_crt_init.
#   $BC40-$BFFF  the OS E: screen also lives here: no printf/puts after gfx_init.
FEATURES {
    STARTADDRESS: default = $2000;
}
SYMBOLS {
    __EXEHDR__:          type = import;
    __SYSTEM_CHECK__:    type = import;
    __AUTOSTART__:       type = import;
    __A8_INIT__:         type = import;   # sdk/src/crt.s (stack, BASIC off)
    __STACKSIZE__:       type = weak, value = $0800;
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak, value = $0000;
}
MEMORY {
    ZP:         file = "", define = yes, start = $0082, size = $007E;
    HEADER:     file = %O,               start = $0000, size = $0002;
    XSEL:       file = %O,               start = $0000, size = $0050;
    XB0:        file = %O,               start = $0000, size = $4010;
    XB1:        file = %O,               start = $0000, size = $4010;
    XB2:        file = %O,               start = $0000, size = $4010;
    XB2HIH:     file = %O,               start = $0000, size = $0004;
    XB2HI:      file = %O, define = yes, start = $6680, size = $1970;
    XB3:        file = %O,               start = $0000, size = $4010;
    XEND:       file = %O,               start = $0000, size = $0010;
    HIRAM1:     file = "", define = yes, start = $C000, size = $1000;
    TEXRAM:     file = "", define = yes, start = $D800, size = $0C00;
    HIRAM2:     file = "", define = yes, start = $E400, size = $1BFA;
    VECRAM:     file = "",               start = $A000, size = $1000;
    SIGRAM:     file = "",               start = $A040, size = $0400;
    SYSCHKHDR:  file = %O,               start = $0000, size = $0004;
    SYSCHKCHNK: file = %O,               start = $2E00, size = $0300;
    SYSCHKTRL:  file = %O,               start = $0000, size = $0006;
    MAINHDR:    file = %O,               start = $0000, size = $0004;
    MAIN:       file = %O, define = yes, start = %S,    size = $9000 - %S;
    TRAILER:    file = %O,               start = $0000, size = $0006;
    STACK:      file = "", define = yes, start = $9000, size = $0800;
    PMG:        file = "", define = yes, start = $9800, size = $0800;
    SCREEN:     file = "", define = yes, start = $A000, size = $2000;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,         type = zp;
    EXTZP:     load = ZP,         type = zp,                optional = yes;
    EXEHDR:    load = HEADER,     type = ro;
    XSEL:      load = XSEL,       type = ro;
    XB0:       load = XB0,        type = ro;
    XB1:       load = XB1,        type = ro;
    XB2:       load = XB2,        type = ro;
    XB2HIH:    load = XB2HIH,     type = ro;
    HICODE:    load = XB2HI, run = HIRAM2, type = ro, define = yes;
    HIRODATA:  load = XB2HI, run = HIRAM2, type = ro, define = yes, optional = yes;
    HIDATA:    load = XB2HI, run = HIRAM2, type = rw, define = yes, optional = yes;
    XB3:       load = XB3,        type = ro;
    XEND:      load = XEND,       type = ro;
    HIBSS:     load = HIRAM1,     type = bss, define = yes;
    VECBSS:    load = VECRAM,     type = bss, optional = yes;
    SIGBSS:    load = SIGRAM,     type = bss, optional = yes;
    SYSCHKHDR: load = SYSCHKHDR,  type = ro,                optional = yes;
    SYSCHK:    load = SYSCHKCHNK, type = rw,  define = yes, optional = yes;
    SYSCHKTRL: load = SYSCHKTRL,  type = ro,                optional = yes;
    MAINHDR:   load = MAINHDR,    type = ro;
    STARTUP:   load = MAIN,       type = ro,  define = yes;
    LOWBSS:    load = MAIN,       type = rw,                optional = yes;
    LOWCODE:   load = MAIN,       type = ro,  define = yes, optional = yes;
    LOWDATA:   load = MAIN,       type = rw,  define = yes, optional = yes;
    ONCE:      load = MAIN,       type = ro,                optional = yes;
    CODE:      load = MAIN,       type = ro,  define = yes;
    RODATA:    load = MAIN,       type = ro;
    ALIGN1K:   load = MAIN,       type = ro,  align = $400, define = yes, optional = yes;   # charsets
    DATA:      load = MAIN,       type = rw;
    INIT:      load = MAIN,       type = bss, define = yes, optional = yes;   # (cc65 <= 2.18: type = rw; project.mk rewrites it)
    BSS:       load = MAIN,       type = bss, define = yes;
    AUTOSTRT:  load = TRAILER,    type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}

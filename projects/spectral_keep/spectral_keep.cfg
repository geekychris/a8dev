# Spectral Keep's linker config (from boing_pinball.cfg). The game switches
# the OS ROM off (src/os.s) and uses the 130XE's four banks:
#
#   $0C00-$1FFF  LOWRAM: the room (R), the bodies, the physics' candidates
#                (BSS, zeroed by os_off)
#   MAIN1  $2000-$3FFF  start-up, LOWCODE (the banks' trampolines, the
#                       blitters, os_off), the C runtime, the SDK, keep_log,
#                       the game's state (BSS): everything banked code calls
#                       or reads is outside $4000-$7FFF
#   MAIN2  $4000-$7FFF  the front end (FRONT*): main loop, view, HUD, title,
#                       sound; never runs with a bank mapped
#   $8000-$A09F         the screen (ANTIC E, 208 lines; view.h)
#   $A0A0-$A7FF         display list, HUD rows
#   $A800-$AFFF         C stack
#   $B000-$B7FF         players and missiles (PMBASE $B0)
#   $B800-$BFFF         the font (os_off copies the ROM's)
#   bank 0              the rules and the rooms (game.c, room.c: B0*)
#   bank 1              the room pictures: pieces and draw lists (GFX1)
#   bank 2              the sprites' frames (GFX2)
#   bank 3              load images of the physics (HICODE) and the keeps
#                       (LEVRO), copied out at start; then the bare room's
#                       picture (view.c), to restore behind what moves
#   HIRAM1 $C000-$CFFF  the keeps (levels.c: LEVRO), under the ROM
#   HIRAM2 $D800-$FFF9  the physics, the maths, the interrupts (HICODE)
FEATURES {
    STARTADDRESS: default = $2000;
}
SYMBOLS {
    __EXEHDR__:          type = import;
    __SYSTEM_CHECK__:    type = import;
    __AUTOSTART__:       type = import;
    __A8_INIT__:         type = import;   # sdk/src/crt.s (stack, BASIC off)
    __STACKSIZE__:       type = weak, value = $0800;
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak, value = $0000;
}
MEMORY {
    ZP:         file = "", define = yes, start = $0082, size = $007E;
    HEADER:     file = %O,               start = $0000, size = $0002;
    XSEL:       file = %O,               start = $0000, size = $0050;
    XB0H:       file = %O,               start = $0000, size = $000A;
    XB0:        file = %O, define = yes, start = $4000, size = $3FFC;
    XB0S:       file = %O,               start = $0000, size = $0008;
    XB1H:       file = %O,               start = $0000, size = $000A;
    XB1:        file = %O, define = yes, start = $4000, size = $3FFC;
    XB1S:       file = %O,               start = $0000, size = $0008;
    XB2H:       file = %O,               start = $0000, size = $000A;
    XB2:        file = %O, define = yes, start = $4000, size = $3FFC;
    XB2S:       file = %O,               start = $0000, size = $0008;
    XB3H:       file = %O,               start = $0000, size = $000A;
    XB3:        file = %O, define = yes, start = $4000, size = $3FFC;
    XB3S:       file = %O,               start = $0000, size = $0008;
    XEND:       file = %O,               start = $0000, size = $0010;
    HIRAM1:     file = "", define = yes, start = $C000, size = $1000;
    HIRAM2:     file = "", define = yes, start = $D800, size = $27FA;
    SYSCHKHDR:  file = %O,               start = $0000, size = $0004;
    SYSCHKCHNK: file = %O,               start = $2E00, size = $0300;
    SYSCHKTRL:  file = %O,               start = $0000, size = $0006;
    LOWMEM:     file = "", define = yes, start = $0C00, size = $1400;
    MAINHDR:    file = %O,               start = $0000, size = $0004;
    MAIN:       file = %O, define = yes, start = %S,    size = $4000 - %S;
    MAIN2HDR:   file = %O,               start = $0000, size = $0004;
    MAIN2:      file = %O, define = yes, start = $4000, size = $4000;
    TRAILER:    file = %O,               start = $0000, size = $0006;
    STACK:      file = "", define = yes, start = $A800, size = $0800;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,         type = zp;
    EXTZP:     load = ZP,         type = zp,                optional = yes;
    EXEHDR:    load = HEADER,     type = ro;
    XSEL:      load = XSEL,       type = ro;
    XB0H:      load = XB0H,       type = ro;
    B0CODE:    load = XB0,        type = ro, define = yes;
    B0RO:      load = XB0,        type = ro, optional = yes;
    B0DATA:    load = XB0,        type = rw, optional = yes;
    XB0S:      load = XB0S,       type = ro;
    XB1H:      load = XB1H,       type = ro;
    GFX1:      load = XB1,        type = ro, define = yes, optional = yes;
    XB1S:      load = XB1S,       type = ro;
    XB2H:      load = XB2H,       type = ro;
    GFX2:      load = XB2,        type = ro, define = yes, optional = yes;
    XB2S:      load = XB2S,       type = ro;
    XB3H:      load = XB3H,       type = ro;
    LEVRO:     load = XB3, run = HIRAM1, type = ro, define = yes;
    HICODE:    load = XB3, run = HIRAM2, type = ro, define = yes;
    XB3S:      load = XB3S,       type = ro;
    XEND:      load = XEND,       type = ro;
    SYSCHKHDR: load = SYSCHKHDR,  type = ro,                optional = yes;
    SYSCHK:    load = SYSCHKCHNK, type = rw,  define = yes, optional = yes;
    SYSCHKTRL: load = SYSCHKTRL,  type = ro,                optional = yes;
    LOWRAM:    load = LOWMEM,     type = bss, define = yes, optional = yes;
    MAINHDR:   load = MAINHDR,    type = ro;
    STARTUP:   load = MAIN,       type = ro,  define = yes;
    LOWBSS:    load = MAIN,       type = rw,                optional = yes;
    LOWCODE:   load = MAIN,       type = ro,  define = yes, optional = yes;
    LOWDATA:   load = MAIN,       type = rw,  define = yes, optional = yes;
    ONCE:      load = MAIN,       type = ro,                optional = yes;
    CODE:      load = MAIN,       type = ro,  define = yes;
    RODATA:    load = MAIN,       type = ro;
    DATA:      load = MAIN,       type = rw;
    INIT:      load = MAIN,       type = bss, define = yes, optional = yes;   # (cc65 <= 2.18: type = rw; project.mk rewrites it)
    BSS:       load = MAIN,       type = bss, define = yes;
    MAIN2HDR:  load = MAIN2HDR,   type = ro;
    FRONT:     load = MAIN2,      type = ro;
    FRONTRO:   load = MAIN2,      type = ro;
    FRONTDATA: load = MAIN2,      type = rw, optional = yes;
    FRONTBSS:  load = MAIN2,      type = bss, define = yes;
    AUTOSTRT:  load = TRAILER,    type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}

# Boing Pinball's linker config (derived from sdk/cfg/a8.cfg). The game
# switches the OS ROM off (src/os.s) and uses the 130XE's banks:
#
#   MAIN1  $2000-$3FFF  start-up, LOWCODE (interrupts, the banks'
#                       trampolines, the maths), the C runtime, the SDK and
#                       pb_common.c (CODE/RODATA/DATA/BSS): everything the
#                       banked code calls must be outside $4000-$7FFF
#   MAIN2  $4000-$7FFF  the front end (FRONT*): never runs with a bank mapped
#   $8000-$8FFF         the table's map, the ROM font copy (pb.h)
#   $A000-$BFFF         the table's fonts, the display lists, the text rows
#   bank 0 $4000        the physics (pb_phys.c, zmath.c, sin_tab.c: B0*)
#   bank 1 $4000        the rules (pb_rules.c: B1*)
#   bank 2 $4000        the physics' cold parts (pb_phys2.c: B2*), and the
#                       table's data (TAB*), copied under the ROM at start
#   bank 3              the graphics (gfx/): the fonts and the map, copied out
#                       at start, and the flippers' frames, copied as they move
#   HIRAM1 $C000-$CFFF  the game (HIBSS: Game G, ...) and the physics' variables
#                       (B0BSS), under the ROM, zeroed at start
#   HIRAM2 $D800-$EFFF  the table (TAB*), under the ROM ($F000-$F7FF: the
#                       quarter squares, maths.s)
#   HIRAM3 $F800-$FFF9  the maths and the display interrupts (HICODE),
#                       copied from bank 2 at start
#
# Derived from the a8dev linker config (cc65 target "atari": the OS ROM stays in, so the same
# XEX runs on a 48K 400/800 and on XL/XE/130XE).
#
# Fixed memory map (sdk/include/a8hw.h has the same numbers):
#   $0C00-$1FFF  LOWRAM: optional, uninitialised (bss, not zeroed), for
#                programs loaded without DOS (the harness, the arcade disk;
#                $0700-$0BFF is the arcade's boot loader, kept for RESET).
#   $2000-$3FFF  STARTUP + LOWCODE + LOWDATA first: below the 130XE bank window
#                ($4000-$7FFF), so the bank routines and bounce buffers stay
#                visible while a bank is mapped. project.mk checks this.
#   $2000-$8FFF  MAIN: code, rodata, data, bss (36K)
#   $9000-$97FF  C stack (2K; a8_crt_init points the stack here)
#   $9800-$9FFF  player/missile graphics (PMBASE $98, single-line)
#   $A000-$BFFF  screen: display list + screen memory (sdk gfx_init); BASIC
#                is switched off on XL/XE by a8_crt_init.
#   $BC40-$BFFF  the OS E: screen also lives here: no printf/puts after gfx_init.
FEATURES {
    STARTADDRESS: default = $2000;
}
SYMBOLS {
    __EXEHDR__:          type = import;
    __SYSTEM_CHECK__:    type = import;
    __AUTOSTART__:       type = import;
    __A8_INIT__:         type = import;   # sdk/src/crt.s (stack, BASIC off)
    __STACKSIZE__:       type = weak, value = $0800;
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak, value = $0000;
}
MEMORY {
    ZP:         file = "", define = yes, start = $0082, size = $007E;
    HEADER:     file = %O,               start = $0000, size = $0002;
    XSEL:       file = %O,               start = $0000, size = $0050;
    XB0H:       file = %O,               start = $0000, size = $000A;
    XB0:        file = %O, define = yes, start = $4000, size = $3FFC;
    XB0S:       file = %O,               start = $0000, size = $0008;
    XB1H:       file = %O,               start = $0000, size = $000A;
    XB1:        file = %O, define = yes, start = $4000, size = $3FFC;
    XB1S:       file = %O,               start = $0000, size = $0008;
    XB2H:       file = %O,               start = $0000, size = $000A;
    XB2:        file = %O, define = yes, start = $4000, size = $3FFC;
    XB2S:       file = %O,               start = $0000, size = $0008;
    XB3H:       file = %O,               start = $0000, size = $000A;
    XB3:        file = %O, define = yes, start = $4000, size = $3FFC;
    XB3S:       file = %O,               start = $0000, size = $0008;
    XEND:       file = %O,               start = $0000, size = $0010;
    HIRAM1:     file = "", define = yes, start = $C000, size = $1000;
    HIRAM2:     file = "", define = yes, start = $D800, size = $1800;   # ($F000-$F7FF: maths.s' quarter squares)
    HIRAM3:     file = "", define = yes, start = $F800, size = $07FA;
    SYSCHKHDR:  file = %O,               start = $0000, size = $0004;
    SYSCHKCHNK: file = %O,               start = $2E00, size = $0300;
    SYSCHKTRL:  file = %O,               start = $0000, size = $0006;
    LOWMEM:     file = "",               start = $0C00, size = $1400;
    MAINHDR:    file = %O,               start = $0000, size = $0004;
    MAIN:       file = %O, define = yes, start = %S,    size = $4000 - %S;
    MAIN2HDR:   file = %O,               start = $0000, size = $0004;
    MAIN2:      file = %O, define = yes, start = $4000, size = $4000;
    TRAILER:    file = %O,               start = $0000, size = $0006;
    STACK:      file = "", define = yes, start = $9000, size = $0800;
    PMG:        file = "", define = yes, start = $9800, size = $0800;
    SCREEN:     file = "", define = yes, start = $A000, size = $2000;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,         type = zp;
    EXTZP:     load = ZP,         type = zp,                optional = yes;
    EXEHDR:    load = HEADER,     type = ro;
    XSEL:      load = XSEL,       type = ro;
    XB0H:      load = XB0H,       type = ro;
    B0CODE:    load = XB0,        type = ro, define = yes;
    B0RO:      load = XB0,        type = ro, optional = yes;
    B0DATA:    load = XB0,        type = rw, optional = yes;
    B0BSS:     load = HIRAM1,     type = bss, optional = yes;   # (zeroed with HIRAM1 at start)
    XB0S:      load = XB0S,       type = ro;
    XB1H:      load = XB1H,       type = ro;
    B1CODE:    load = XB1,        type = ro, define = yes;
    B1RO:      load = XB1,        type = ro, optional = yes;
    B1DATA:    load = XB1,        type = rw, optional = yes;
    B1BSS:     load = XB1,        type = rw, optional = yes;
    XB1S:      load = XB1S,       type = ro;
    XB2H:      load = XB2H,       type = ro;
    B2CODE:    load = XB2,        type = ro, define = yes;
    B2RO:      load = XB2,        type = ro, optional = yes;
    B2DATA:    load = XB2,        type = rw, optional = yes;
    B2BSS:     load = XB2,        type = rw, optional = yes;
    TABRO:     load = XB2, run = HIRAM2, type = ro, define = yes;
    TABDATA:   load = XB2, run = HIRAM2, type = rw, define = yes;
    HICODE:    load = XB2, run = HIRAM3, type = ro, define = yes;
    XB2S:      load = XB2S,       type = ro;
    XB3H:      load = XB3H,       type = ro;
    GFX:       load = XB3,        type = ro, define = yes, optional = yes;
    XB3S:      load = XB3S,       type = ro;
    XEND:      load = XEND,       type = ro;
    HIBSS:     load = HIRAM1,     type = bss, define = yes;
    TABBSS:    load = HIRAM2,     type = bss, define = yes, optional = yes;
    SYSCHKHDR: load = SYSCHKHDR,  type = ro,                optional = yes;
    SYSCHK:    load = SYSCHKCHNK, type = rw,  define = yes, optional = yes;
    SYSCHKTRL: load = SYSCHKTRL,  type = ro,                optional = yes;
    LOWRAM:    load = LOWMEM,     type = bss, define = yes, optional = yes;
    MAINHDR:   load = MAINHDR,    type = ro;
    STARTUP:   load = MAIN,       type = ro,  define = yes;
    LOWBSS:    load = MAIN,       type = rw,                optional = yes;
    LOWCODE:   load = MAIN,       type = ro,  define = yes, optional = yes;
    LOWDATA:   load = MAIN,       type = rw,  define = yes, optional = yes;
    ONCE:      load = MAIN,       type = ro,                optional = yes;
    CODE:      load = MAIN,       type = ro,  define = yes;
    RODATA:    load = MAIN,       type = ro;
    ALIGN1K:   load = MAIN,       type = ro,  align = $400, define = yes, optional = yes;   # charsets
    DATA:      load = MAIN,       type = rw;
    INIT:      load = MAIN,       type = bss, define = yes, optional = yes;   # (cc65 <= 2.18: type = rw; project.mk rewrites it)
    BSS:       load = MAIN,       type = bss, define = yes;
    MAIN2HDR:  load = MAIN2HDR,   type = ro;
    FRONT:     load = MAIN2,      type = ro;
    FRONTRO:   load = MAIN2,      type = ro;
    FRONTDATA: load = MAIN2,      type = rw, optional = yes;
    FRONTBSS:  load = MAIN2,      type = bss, define = yes;
    AUTOSTRT:  load = TRAILER,    type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}

[project]
name = "a8dev"
version = "0.1.0"
description = "Atari 8-bit dev harness: scriptable Atari800 host, CLI, MCP server and DevBench (web UI + REST)"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10",
  "numpy>=1.24",           # asset tools (pictures, fonts)
  "mcp>=2.3,<3",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.scripts]
a8dev = "a8dev.cli:main"
a8dev-mcp = "a8dev.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a8dev"]
